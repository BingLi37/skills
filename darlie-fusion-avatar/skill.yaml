name: darlie-fusion-avatar
title: 黑人牙膏融合头像
description: 把用户上传的任意领域头像（游戏、动漫、影视、品牌吉祥物、动物、机器人、真人等）融合成黑人牙膏（DARLIE 好来）绅士头像风格：保留黑人牙膏的白剪影脸、露齿笑、黑领结和右侧白色闪星，背景用符合源头像主题的饱和纯色（无明确主题色时默认绿底），去掉高礼帽，换上源头像的发型或头部特征与服装，生成一张正方形融合头像图；真人照片走真人模式，保留本人长相转黑白剪影画法，不加领结和闪星。触发词：黑人牙膏融合、达利融合、好来融合、Darlie fusion、把头像融合成黑人牙膏、上传头像转黑人牙膏风、牙膏绅士头像。
category: "Media"
include_in_prompt: true
